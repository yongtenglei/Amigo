name: build

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        description: Go version override. When empty, go-version-file selects the version.
      go-version-file:
        required: false
        type: string
        default: go.mod
        description: File used to select the Go version when go-version is empty.
      os:
        required: false
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
        description: JSON array of runner labels for the build and test matrix.
      working-directory:
        required: false
        type: string
      tidy-command:
        required: false
        type: string
        default: go mod tidy
      build-command:
        required: false
        type: string
        default: go build ./...
      test-command:
        required: false
        type: string
        default: go test ./...
      govulncheck-command:
        required: false
        type: string
        default: govulncheck ./...

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Verify tidy state
        run: ${{ inputs.tidy-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Check for working tree drift
        run: git diff --exit-code
        working-directory: ${{ inputs.working-directory }}

      - name: Run govulncheck
        run: ${{ inputs.govulncheck-command }}
        working-directory: ${{ inputs.working-directory }}

  build:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Verify tidy state
        run: ${{ inputs.tidy-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Check for working tree drift
        run: git diff --exit-code
        working-directory: ${{ inputs.working-directory }}

      - name: Build
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Test
        run: ${{ inputs.test-command }}
        working-directory: ${{ inputs.working-directory }}
