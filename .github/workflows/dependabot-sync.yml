name: dependabot-sync

on:
  workflow_call:
    inputs:
      amigo_repository:
        type: string
        required: false
        default: yongtenglei/Amigo
      sync_branch:
        required: false
        type: string
        default: ci/sync-dependabot-config
    secrets:
      amigo_pull_request_token:
        required: false
        description: Token used to push the generated branch and create its pull request.

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          path: ${{ github.repository }}

      - name: Checkout amigo repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.amigo_repository }}
          path: amigo

      - name: Sync dependabot config
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ github.repository }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          TARGET_FILE="${TARGET}/.github/dependabot.yml"
          SHARED_GOMOD="amigo/dependabot/dependabot-gomod.yml"
          REPO_SPECIFIC="amigo/dependabot/dependabot-${REPO_NAME}.yml"

          mkdir -p "${TARGET}/.github"
          cp amigo/.github/dependabot.yml "${TARGET_FILE}"

          if [ -f "${SHARED_GOMOD}" ]; then
            cat "${SHARED_GOMOD}" >> "${TARGET_FILE}"
          fi

          if [ -f "${REPO_SPECIFIC}" ]; then
            cat "${REPO_SPECIFIC}" >> "${TARGET_FILE}"
          fi

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.amigo_pull_request_token || github.token }}
          commit-message: "ci: sync dependabot config"
          title: "ci: sync dependabot config"
          body: |
            This is an automated pull request to sync the Dependabot config with the amigo repository.
          branch: ${{ inputs.sync_branch }}
          delete-branch: true
          path: ${{ github.repository }}
