name: lint-sync

on:
  workflow_call:
    inputs:
      amigo_repository:
        type: string
        required: false
        default: yongtenglei/amigo
      sync_branch:
        type: string
        required: false
        default: ci/sync-lint-config
    secrets:
      amigo_pull_request_token:
        required: false
        description: Token used to push the generated branch and create its pull request.

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          path: ${{ github.repository }}

      - name: Checkout amigo repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.amigo_repository }}
          path: amigo

      - name: Sync golangci config
        run: cp amigo/golangci.yml ${{ github.repository }}/.golangci.yml

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.amigo_pull_request_token || github.token }}
          commit-message: "ci: sync golangci-lint config"
          title: "ci: sync golangci-lint config"
          body: |
            This is an automated pull request to sync the golangci-lint config with the amigo repository.
          branch: ${{ inputs.sync_branch }}
          delete-branch: true
          path: ${{ github.repository }}
