name: lint

on:
  workflow_call:
    inputs:
      amigo_repository:
        type: string
        required: false
        description: Repository containing shared CI assets.
      directory:
        type: string
        required: false
        description: Path to the directory to run golangci-lint in.
      golangci_path:
        type: string
        required: false
        description: Path to the golangci-lint config file.
      golangci_version:
        type: string
        required: false
        description: Version of golangci-lint to use.
      os:
        type: string
        required: false
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
        description: JSON array of runner labels for the lint matrix.
      timeout:
        type: string
        required: false
        description: Timeout for golangci-lint.
    secrets:
      amigo_token:
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Normalize Git line endings on Windows
        run: git config --global core.autocrlf input

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          path: ${{ github.repository }}

      - name: Checkout amigo repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.amigo_repository || 'yongtenglei/amigo' }}
          path: amigo
          token: ${{ secrets.amigo_token || github.token }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci_version || 'v2.11.3' }}
          working-directory: ${{ format('{0}/{1}', github.repository, inputs.directory || '') }}
          args: >
            --config=${{ inputs.golangci_path || format('{0}/amigo/golangci.yml', github.workspace) }}
            --timeout=${{ inputs.timeout || '10m' }}
            ./...
