name: tooling-sync

on:
  workflow_call:
    inputs:
      amigo_repository:
        type: string
        required: false
        default: yongtenglei/amigo
      sync_branch:
        type: string
        required: false
        default: ci/sync-tooling
    secrets:
      amigo_token:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          path: ${{ github.repository }}

      - name: Checkout amigo repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.amigo_repository }}
          path: amigo
          token: ${{ secrets.amigo_token || github.token }}

      - name: Sync tooling assets
        run: |
          mkdir -p "${{ github.repository }}/scripts/lib"
          cp amigo/templates/.markdownlint.jsonc "${{ github.repository }}/.markdownlint.jsonc"
          cp amigo/templates/.prettierrc.json "${{ github.repository }}/.prettierrc.json"
          cp amigo/templates/scripts/install_deps.sh "${{ github.repository }}/scripts/install_deps.sh"
          cp amigo/templates/scripts/lib/output.sh "${{ github.repository }}/scripts/lib/output.sh"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.amigo_token || github.token }}
          commit-message: "ci: sync tooling assets"
          title: "ci: sync tooling assets"
          body: |
            This is an automated pull request to sync shared tooling assets from the amigo repository.
          branch: ${{ inputs.sync_branch }}
          delete-branch: true
          path: ${{ github.repository }}
